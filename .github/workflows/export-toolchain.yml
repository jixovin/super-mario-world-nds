# Manually-run helper: packs the devkitPro NDS toolchain from the official
# container into the "toolchain" branch, so a development machine without
# access to devkitPro's package servers can build locally.
name: Export toolchain

on:
  workflow_dispatch:
  # Pushing any commit to this branch also runs it.
  push:
    branches: [make-toolchain]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Pack
        shell: bash
        run: |
          set +e
          exec > /tmp/export.log 2>&1
          (command -v git && command -v zstd) || (apt-get update -qq && apt-get install -y -qq git zstd)
          cd /opt
          DIRS=""
          for d in devkitpro/devkitARM devkitpro/libnds devkitpro/calico devkitpro/tools/bin \
                   devkitpro/portlibs/nds devkitpro/portlibs/arm devkitpro/devkitarm.sh \
                   devkitpro/ndsvars.sh devkitpro/armv4tvars.sh; do
            [ -e "$d" ] && DIRS="$DIRS $d"
          done
          echo "packing:$DIRS"; du -sh $DIRS
          mkdir -p /tmp/tc
          tar -cf - $DIRS | zstd -T0 -12 -q -o /tmp/tc/devkitpro-nds.tar.zst
          cd /tmp/tc && split -b 45m devkitpro-nds.tar.zst devkitpro-nds.tar.zst.part-
          rm -f devkitpro-nds.tar.zst; ls -la
          cp /tmp/export.log export.log
          git init -q && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "devkitPro NDS toolchain snapshot"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:toolchain
          echo "push exit $?"
      - name: Publish log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/lg && cd /tmp/lg && git init -q
          cp /tmp/export.log . 2>/dev/null || echo "no log" > export.log
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm log
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:toolchain-log
