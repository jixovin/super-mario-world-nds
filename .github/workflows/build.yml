name: Build NDS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -C nds
      - name: Upload .nds
        uses: actions/upload-artifact@v4
        with:
          name: smw-nds-${{ github.sha }}
          path: nds/build/smw-nds.nds
          if-no-files-found: error
