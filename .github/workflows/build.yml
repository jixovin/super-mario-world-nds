name: Build NDS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      # CI never sees a ROM, so this .nds has no game data built in; it reads
      # smw_assets.dat from the SD card. build.bat makes the all-in-one .nds.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make -C nds 2>&1 | tee build.log
      - name: Upload .nds
        uses: actions/upload-artifact@v4
        with:
          name: smw-nds-${{ github.sha }}
          path: nds/smw-nds.nds
          if-no-files-found: error

  core:
    # The shared game core, built for the desktop test harness.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop harness
        run: make -C tools/hostrun
